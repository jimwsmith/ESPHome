#Specific setup to run code on a M5STack CoreS3 unit

esphome:
  name: ${esphome_name}
  friendly_name: ${friendly_name}
  on_boot:
    - priority: -100 #Ensure this runs after lvgl is initialised
      then:
        - delay: 4s
        - lvgl.widget.hide: boot_screen
        - delay: 20s # Give long enough for hardware to detect power state
        - script.execute: check_charger
        - script.execute: check_charge_level
  # libraries:
  #   - m5stack/M5GFX@^0.1.11
  #   - m5stack/M5Unified@^0.1.11

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    ## Note: Disable these configurations if you face the boot loop issue.
    sdkconfig_options:
        CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
        CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
        CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
        # Moves instructions and read only data from flash into PSRAM on boot.
        # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
        # Considerably speeds up mWW at the cost of using more PSRAM.
        CONFIG_SPIRAM_RODATA: "y"
        CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [axp2101, aw88298, aw9523b ]

#Audio needs to be 16bit 16kHz for the microphone and 48kHz for the speaker. The resampler will convert the media audio to 48kHz for the speaker.
audio_file:
  - id: alarm_sound
    file: "./sounds/alarm.flac" # Place this file in the same directory as your YAML config
  - id: cantdo_sound
    file: "./sounds/cantdo16.wav" # Place this file in the same directory as your YAML config


audio_adc:
  - platform: es7210
    id: es7210_adc
    i2c_id: bsp_bus
    bits_per_sample: 16bit
    sample_rate: 16000
    mic_gain: 36

audio_dac:
  - platform: aw88298
    id: aw88298_dac
    i2c_id: bsp_bus
    sample_rate: 48000

microphone:
  - platform: i2s_audio
    id: i2s_mic
    i2s_din_pin: GPIO14
    adc_type: external
    sample_rate: 16000
    bits_per_sample: 16bit 
    i2s_audio_id: i2s_audio_bus

speaker:
  - platform: i2s_audio
    i2s_audio_id: i2s_audio_bus
    id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO13
    audio_dac: aw88298_dac
  # Resampler to convert media audio to 48kHz
  - platform: resampler
    id: media_resampled
    # output_speaker: mixer_speaker
    output_speaker: i2s_speaker
    sample_rate: 48000

media_player:
  - platform: speaker
    name: "My Speaker"
    id: my_speaker
    # media_pipeline:
    #   speaker: media_mixer_input_speaker_id
    #   format: FLAC
    announcement_pipeline:
      # speaker: announcement_mixer_input_speaker_id
      # speaker: i2s_speaker
      speaker: media_resampled
      format: NONE #NONE means that all transcoders are loaded
      sample_rate: 48000
      num_channels: 1
    files:
      - id: timer_finished_sound
        file: ${timer_finished_sound_file}

script:
  - id: play_sound
    parameters:
      priority: bool
      sound_file: "audio::AudioFile*"
    then:
      - lambda: |-
          if (priority) {
            id(my_speaker)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ( (id(my_speaker).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING ) || priority) {
            id(my_speaker)
              ->play_file(sound_file, true, false);
          }


i2s_audio:
  id: i2s_audio_bus
  i2s_lrclk_pin: GPIO33
  i2s_bclk_pin: GPIO34
  i2s_mclk_pin:
    number: GPIO0
    ignore_strapping_warning: true

i2c:
  - id: bsp_bus
    sda: GPIO12
    scl: GPIO11
    scan: true
  - id: ext_bus
    sda: GPIO2
    scl: GPIO1
    scan: true

spi:
  - id: spi_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

# Power Management
axp2101:
  id: axp2101_pmu
  i2c_id: bsp_bus

# IO Expander
aw9523b:
  id: aw9523b_hub
  i2c_id: bsp_bus
  p0_drive_mode: PUSH_PULL

output:
  - platform: axp2101
    type: range
    channel: DLDO1
    id: lcd_backlight_output
    min_voltage: 2600
    max_voltage: 3300

  - platform: axp2101
    channel: ALDO1 #VDD_1V8
    voltage: 1800

  - platform: axp2101 #VDDA_3V3
    channel: ALDO2
    voltage: 3300

  - platform: axp2101 #VDDCAM_3V3
    channel: ALDO3
    voltage: 3300

  - platform: axp2101 #VDD_3V3_SD
    channel: ALDO4
    voltage: 3300

  - platform: axp2101
    channel: BLDO1
    voltage: 2800

  - platform: axp2101
    channel: BLDO2
    voltage: 1500

switch:
  - platform: gpio
    name: "AW RST P0_2"
    pin:
      aw9523b_id: aw9523b_hub
      number: 2
    internal: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true

  - platform: gpio
    name: "CAM RST P1_0"
    pin:
      aw9523b_id: aw9523b_hub
      number: 8
    internal: true
    restore_mode: RESTORE_DEFAULT_ON
    disabled_by_default: true

  - platform: gpio
    name: "BUS_OUT_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 1
    # BUS_OUT_EN = 0
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "USB_OTG_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 5
    # USB_OTG_EN = 0
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: gpio
    name: "BOOST_EN"
    pin:
      aw9523b_id: aw9523b_hub
      number: 15
    # BOOST_EN
    restore_mode: RESTORE_DEFAULT_ON


touchscreen:
  - platform: ft63x6
    i2c_id: bsp_bus
    id: touch
    reset_pin:
      aw9523b_id: aw9523b_hub #Note syntax cahnge from aw9523b: to aw9523b_id: to avoid error "Invalid pin type for reset_pin"
      number: 0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

display:
  - platform: mipi_spi
    model: M5CORE
    dc_pin: GPIO35
    reset_pin:
      aw9523b_id: aw9523b_hub #Note syntax cahnge from aw9523b: to aw9523b_id: to avoid error "Invalid pin type for reset_pin"
      number: 9
    cs_pin: 
      number: GPIO3
      ignore_strapping_warning: true
    data_rate: 40MHz
    invert_colors: true
    id: m5core_lcd
    # show_test_card: true #Don't show it as it will corrupt the boot-up display

light:
  - platform: monochromatic
    id: display_backlight
    name: "LCD Backlight"
    icon: "mdi:television"
    entity_category: config
    output: lcd_backlight_output
    restore_mode: ALWAYS_ON #Always want to have a backlight on when we boot up
    default_transition_length: 250ms

#=========================================================================================================


binary_sensor:

  - platform: gpio
    name: "ES_INT P0_3"
    pin:
      aw9523b_id: aw9523b_hub
      number: 3
    on_press:
      then:
        - logger.log: "ES7210 interrupt triggered"
    internal: true

  - platform: gpio
    name: "TF_SW P0_4"
    pin:
      aw9523b_id: aw9523b_hub
      number: 4 
    on_press:
      then:
        - logger.log: "TF_SW interrupt triggered"
    internal: true
  
  - platform: gpio
    name: "TOUCH_INT P1_2"
    pin:
      aw9523b_id: aw9523b_hub
      number: 10
    on_press:
      then:
        - logger.log: "TOUCH interrupt triggered"
    internal: true

  - platform: gpio
    name: "AW_INT P1_3"
    pin:
      aw9523b_id: aw9523b_hub
      number: 11
    on_press:
      then:
        - logger.log: "AW88298 interrupt triggered"
    internal: true

#=========================================================================================================
sensor:
# PMU
  - platform: axp2101
    id: axp2101_sensor
    battery_voltage:
      name: "Battery Voltage"
    axp_temperature:
      name: "AXP2101 Temperature"
    battery_charging:
      id: charger_connected
      name: "Battery Charging"
      entity_category: "diagnostic"
      on_state: #When value changes update LVGL display
      - script.execute: check_charger
    battery_level:
      name: "Battery Level"
      id: battery_percent
      on_value:
        - script.execute: check_charge_level

  - platform: ltr_als_ps
    i2c_id: bsp_bus
    address: 0x23
    update_interval: 10s
    auto_mode: false
    type: ALS_PS  # or ALS or PS
    ambient_light: "Ambient light"
    infrared_counts: 
      name: "Infrared counts"
      id: ir_counts
      unit_of_measurement: "units" #lx works with illuminance
      device_class: "" #None
    full_spectrum_counts: 
      name: "Full spectrum counts"
      id: fs_counts
      unit_of_measurement: "units"
      device_class: "" #None
    actual_gain: "Actual Gain"
    actual_integration_time: "Actual Integration Time"
    # PS only section
    ps_cooldown: 5 s
    ps_high_threshold: 500
    on_ps_high_threshold:
      then:
        - logger.log: "ALS-PS Threshold reached" # do something - light up the screen for example
    ps_counts: 
      name: "Proximity counts"
      id: ps_counts
      device_class: "" #None
      unit_of_measurement: "units"
