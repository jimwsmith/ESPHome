sensor:
  - platform: mqtt_subscribe
    id: temp1_sensor
    topic: hothome_data/hh${hot_home_number}/t01
    on_value: 
      then:
        - lvgl.label.update:
            id: val_temp1
            text:
              format: "%.1f°C"
              args: [ 'id(temp1_sensor).state' ]
        - lvgl.bar.update:
            id: bar_temp1
            value: !lambda 'return (id(temp1_sensor).state) * $temp_bar_scale;'
