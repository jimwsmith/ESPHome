 #==========================================================================================================================
    - id: controls_page
      bg_color: 0x000000 #black
      widgets:
        - obj:
            align: TOP_MID
            styles: header_footer
            widgets:
              - label:
                  text: "Hot Home ${hot_home_number} Controls"
                  align: CENTER
                  text_align: CENTER
                  text_color: 0xFFFFFF #white
        - obj: # a properly placed coontainer object for all these controls
            text_color: white
            align: CENTER
            width: 320
            height: 180 #240-(2*30) #Display area less header & footer
            pad_all: 0
            bg_opa: TRANSP #COVER
            border_opa: TRANSP
            # outline_width: 1 #debug top check we fill available space
            layout: # enable the GRID layout for the children widgets
              type: GRID # split the rows and the columns proportionally
              grid_columns: [FR(1), FR(2)] # label, value, label, value
              grid_rows: [FR(1), FR(1), FR(1), FR(1)] # like percents
              pad_row: 2
              pad_column: 1 # was 2
              multiple_widgets_per_cell: true  #Flag to overcome bug introduced when ESPHome started checking for overlaid widgets
            widgets:
              - label:
                  grid_cell_column_pos: 0 # place the widget in
                  grid_cell_row_pos: 0 # the corresponding cell
                  grid_cell_x_align: START
                  grid_cell_y_align: CENTER
                  id: lbl_volume_control
                  text: "Volume"
                  styles: lbl_left
              - slider:
                  grid_cell_column_pos: 1 # place the widget in
                  grid_cell_row_pos: 0 # the corresponding cell
                  grid_cell_x_align: START
                  grid_cell_y_align: CENTER
                  id: slider_volume_control
                  width: 200
                  height: 20
                  pad_all: 8
                  min_value: 1
                  max_value: 100
                  value: 80 #Initial volume
                  adv_hittest: true
                  bg_color: 0x000000
                  bg_opa: COVER
                  indicator:
                    bg_color: BLUE
                    bg_opa: COVER
                  knob:
                    bg_color: GREEN
                    radius: 4
                    pad_left: -2
                    pad_right: -2
                    # on_value:
                    #     - homeassistant.action:
                    #         action: media_player.volume_set
                    #         data:
                    #         entity_id: my_speaker
                    #         volume_level: !lambda return (x / 100);

#==========================================================================================================================

number:
  # - platform: template
  - platform: lvgl
    widget: slider_volume_control
    id: volume_control
    name: "Volume Control" # Needs a name otherwise will never appear in the HA front end
    mode: slider
    entity_category: config
    restore_value: true
    on_value:
      then:
        - media_player.volume_set:
            id: my_speaker
            volume: !lambda return id(volume_control).state/100;
        - script.execute: repeat_alarm #just in case low volume was set so don't attempt to play sound
